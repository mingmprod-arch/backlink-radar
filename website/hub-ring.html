<!-- Backlink Hub — Private Ring invite landing. Paste into WP page /hub-ring/ (full-width template, no theme header/footer). -->
<style>
  .bh-ring * { box-sizing: border-box; margin: 0; padding: 0; }
  .bh-ring {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0a0f; color: #e8e8ee; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    padding: 48px 20px;
  }
  .bh-ring .card {
    width: 100%; max-width: 460px; background: #121218; border: 1px solid #23232e;
    border-radius: 20px; padding: 44px 36px; text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }
  .bh-ring .badge {
    display: inline-block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: #a78bfa; border: 1px solid #3b2f63; background: rgba(139,92,246,.08);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 22px;
  }
  .bh-ring h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }
  .bh-ring p.sub { font-size: 14px; line-height: 1.7; color: #9a9aad; margin-bottom: 26px; }
  .bh-ring .ringname { color: #a78bfa; font-weight: 600; }
  .bh-ring input {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #2c2c3a;
    background: #0d0d13; color: #e8e8ee; font-size: 15px; outline: none; margin-bottom: 12px;
    transition: border-color .15s;
  }
  .bh-ring input:focus { border-color: #8b5cf6; }
  .bh-ring button {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: #8b5cf6; color: #fff; font-size: 15px; font-weight: 600;
    transition: background .15s, transform .05s;
  }
  .bh-ring button:hover { background: #7c4deb; }
  .bh-ring button:active { transform: scale(.99); }
  .bh-ring button:disabled { opacity: .55; cursor: default; }
  .bh-ring .msg { font-size: 13.5px; line-height: 1.6; margin-top: 16px; min-height: 20px; }
  .bh-ring .msg.ok { color: #34d399; }
  .bh-ring .msg.err { color: #f87171; }
  .bh-ring .slots { font-size: 12px; color: #6d6d80; margin-top: 20px; }
  .bh-ring .perks { text-align: left; margin: 0 0 26px; padding-left: 2px; }
  .bh-ring .perks li { font-size: 13.5px; color: #b9b9c7; line-height: 1.5; margin-bottom: 10px; list-style: none; padding-left: 24px; position: relative; }
  .bh-ring .perks li::before { content: "✦"; position: absolute; left: 0; color: #8b5cf6; }
</style>
<div class="bh-ring">
  <div class="card">
    <div class="badge">Private Invite</div>
    <h1 id="bh-title">Checking your invite…</h1>
    <p class="sub" id="bh-sub"></p>
    <ul class="perks" id="bh-perks" style="display:none">
      <li>Ring members get <b>priority matching</b> — your pitches surface first</li>
      <li>Auto-paired backlinks between trusted sites, no cold outreach</li>
      <li>Direct-swap guard keeps the ring Google-safe (no A↔B patterns)</li>
    </ul>
    <div id="bh-form" style="display:none">
      <input type="email" id="bh-email" placeholder="you@yourdomain.com" autocomplete="email">
      <button id="bh-btn">Join the ring — get my API key</button>
    </div>
    <div class="msg" id="bh-msg"></div>
    <div class="slots" id="bh-slots"></div>
  </div>
</div>
<script>
(function () {
  var API = "https://hub.recmoment.net";
  var code = new URLSearchParams(location.search).get("code") || "";
  var $ = function (id) { return document.getElementById(id); };
  var title = $("bh-title"), sub = $("bh-sub"), form = $("bh-form"), perks = $("bh-perks"),
      msg = $("bh-msg"), slots = $("bh-slots"), btn = $("bh-btn"), email = $("bh-email");

  function fail(t) { title.textContent = "Invite not valid"; sub.textContent = t; }

  if (!code) { fail("This page needs an invite link. Ask the ring owner for one."); return; }

  fetch(API + "/hub/public/invite/" + encodeURIComponent(code))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || !res.j.valid) { fail("This invite link is invalid or has been fully used."); return; }
      title.innerHTML = "You're invited to <span class='ringname'></span>";
      title.querySelector(".ringname").textContent = res.j.ringName;
      sub.textContent = "A private backlink exchange ring on Backlink Hub. Join free — your API key arrives by email in under a minute.";
      perks.style.display = ""; form.style.display = "";
      if (res.j.slotsLeft != null) slots.textContent = res.j.slotsLeft + " invite slots left";
    })
    .catch(function () { fail("Could not verify the invite right now — please reload."); });

  btn.addEventListener("click", function () {
    var em = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { msg.className = "msg err"; msg.textContent = "Please enter a valid email."; return; }
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Creating your key…";
    fetch(API + "/hub/public/signup", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: em, inviteCode: code })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { msg.className = "msg err"; msg.textContent = res.j.error || "Something went wrong."; btn.disabled = false; return; }
        msg.className = "msg ok";
        msg.textContent = res.j.already
          ? "This email is already registered — check your inbox for the original key email."
          : "Done! Check your inbox and click the activation link — then paste the key into your AI agent. You're in the ring.";
        form.style.display = "none";
      })
      .catch(function () { msg.className = "msg err"; msg.textContent = "Network error — please try again."; btn.disabled = false; });
  });
})();
</script>
