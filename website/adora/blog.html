<div class="ad">
  <section class="ad-hero">
    <p class="ad-kicker">Blog</p>
    <h1 class="ad-h1">AI SEO <span class="ad-sq magenta">筆記<svg viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 8 Q 14 2, 26 7 T 50 7 T 74 7 T 98 6" fill="none" stroke-width="4" stroke-linecap="round"/></svg></span></h1>
    <p class="ad-sub">實戰心得、案例同教學——唔講廢話。</p>
  </section>

  <section class="ad-sec" style="padding-top:0;max-width:760px;margin:0 auto" id="ad-posts">
    <p class="ad-muted" style="text-align:center">載入中…</p>
  </section>

  <div class="ad-foot">
    <a href="/">首頁</a><a href="/about/">About</a><a href="/faq/">FAQ</a><a href="/contact/">聯絡</a><br><br>
    © 2026 Rec Moment · Gain Tune International Limited
  </div>
</div>
<script>
fetch('/wp-json/wp/v2/posts?per_page=20&_fields=id,date,link,title,excerpt')
  .then(function(r){return r.json()})
  .then(function(posts){
    var box = document.getElementById('ad-posts');
    if (!posts.length) { box.innerHTML = '<p class="ad-muted" style="text-align:center">仲未有文章，好快有。</p>'; return; }
    box.innerHTML = posts.map(function(p){
      var d = new Date(p.date).toISOString().slice(0,10);
      var ex = p.excerpt.rendered.replace(/<[^>]+>/g,'').trim().slice(0,140);
      return '<a class="ad-post" href="' + p.link + '"><div class="meta">' + d + '</div><h3>' + p.title.rendered + '</h3><p>' + ex + '…</p></a>';
    }).join('');
  })
  .catch(function(){ document.getElementById('ad-posts').innerHTML = '<p class="ad-muted" style="text-align:center">載入失敗，請刷新。</p>'; });
</script>
